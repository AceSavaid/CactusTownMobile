<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#e7e2d2"/>

  <!-- wood wainscot along the back wall -->
  <rect x="0" y="560" width="1920" height="96" fill="#a37c54"/>
  <rect x="0" y="560" width="1920" height="14" fill="#b78f63"/>
  <g stroke="#8c663f" stroke-width="4"><path d="M300 560 V656 M640 560 V656 M980 560 V656 M1320 560 V656 M1640 560 V656"/></g>
  <rect x="0" y="650" width="1920" height="26" fill="#8f6a44"/>

  <!-- warm wood-plank floor -->
  <rect x="0" y="676" width="1920" height="404" fill="#b78a5b"/>
  <g stroke="#9c7248" stroke-width="4">
    <path d="M0 772 H1920 M0 892 H1920 M0 1010 H1920"/>
    <path d="M170 676 V772 M470 676 V772 M760 772 V892 M1080 772 V892 M330 892 V1010 M690 892 V1010 M1120 892 V1010 M1500 772 V892"/>
  </g>
  <rect x="0" y="1046" width="1920" height="34" fill="#8c6440"/>

  <!-- greenhouse windows onto a leafy street -->
  <g id="win">
    <path d="M150 128 q0 -78 175 -78 q175 0 175 78 V520 H150 Z" fill="#f0ead6"/>
    <rect x="176" y="150" width="298" height="352" fill="#dfe6e4"/>
    <rect x="176" y="150" width="298" height="120" fill="#e7ecdf"/>
    <!-- skyline -->
    <g fill="#b7a992"><rect x="176" y="300" width="70" height="202"/><rect x="330" y="270" width="60" height="232"/><rect x="420" y="316" width="54" height="186"/></g>
    <g fill="#9aa78e"><rect x="252" y="286" width="72" height="216"/></g>
    <g fill="#efe6d0"><rect x="190" y="316" width="12" height="14"/><rect x="212" y="316" width="12" height="14"/><rect x="190" y="344" width="12" height="14"/><rect x="212" y="344" width="12" height="14"/><rect x="270" y="304" width="12" height="14"/><rect x="294" y="304" width="12" height="14"/><rect x="270" y="332" width="12" height="14"/><rect x="294" y="332" width="12" height="14"/><rect x="344" y="290" width="12" height="14"/><rect x="366" y="290" width="12" height="14"/><rect x="344" y="318" width="12" height="14"/><rect x="366" y="318" width="12" height="14"/></g>
    <!-- street trees -->
    <rect x="212" y="430" width="10" height="60" fill="#7c5a3e"/><ellipse cx="217" cy="416" rx="40" ry="34" fill="#7ba36f"/>
    <rect x="398" y="440" width="10" height="52" fill="#7c5a3e"/><ellipse cx="403" cy="426" rx="34" ry="30" fill="#89b17b"/>
    <rect x="176" y="486" width="298" height="16" fill="#9aa091"/>
    <!-- glazing bars -->
    <g stroke="#e7e2cf" stroke-width="12" fill="none"><path d="M325 150 V502 M176 300 H474 M176 410 H474"/></g>
    <path d="M150 128 q0 -78 175 -78 q175 0 175 78 V520 H150 Z" fill="none" stroke="#f5f0dd" stroke-width="18"/>
    <rect x="128" y="510" width="394" height="22" rx="5" fill="#8f6a44"/>
  </g>
  <use href="#win" x="612"/>

  <!-- a framed botanical print on the left wall -->
  <g>
    <rect x="470" y="150" width="150" height="182" rx="6" fill="#8a5a34"/>
    <rect x="484" y="164" width="122" height="154" fill="#f2ede0"/>
    <rect x="510" y="256" width="70" height="16" fill="#c8b79f"/>
    <rect x="534" y="182" width="12" height="76" rx="6" fill="#6a9c62"/>
    <path d="M540 200 q-24 6 -30 26 M540 224 q24 6 30 26" stroke="#7ba36f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="540" cy="176" r="7" fill="#e08aa0"/>
  </g>

  <!-- long shelf under middle window with little pots -->
  <rect x="762" y="556" width="396" height="18" rx="4" fill="#8a5a34"/>
  <rect x="788" y="574" width="16" height="30" fill="#744928"/>
  <rect x="1116" y="574" width="16" height="30" fill="#744928"/>
  <g>
    <path d="M800 520 h44 l-6 34 h-32 z" fill="#c07348"/><path d="M808 524 q-16 -34 4 -46 M824 524 q14 -30 -2 -44 M816 524 q-2 -40 0 -52" stroke="#6a9c62" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M880 522 h48 l-6 32 h-36 z" fill="#dcd6c6"/><ellipse cx="904" cy="500" rx="26" ry="19" fill="#7ba36f"/>
    <path d="M964 518 h44 l-6 36 h-32 z" fill="#c07348"/><rect x="978" y="484" width="12" height="40" rx="6" fill="#6a9c62"/><circle cx="984" cy="482" r="5" fill="#e08aa0"/>
    <path d="M1044 522 h50 l-6 32 h-38 z" fill="#b6ada0"/><path d="M1069 484 q-24 24 0 46 q24 -24 0 -46z" fill="#89b17b"/>
    <path d="M1108 520 h42 l-6 34 h-30 z" fill="#c07348"/><circle cx="1129" cy="502" r="16" fill="#7ba36f"/>
  </g>

  <!-- trailing hanging plants in the top corners -->
  <g>
    <path d="M150 0 V150" stroke="#8a7a58" stroke-width="4"/>
    <path d="M108 150 h84 l-13 48 h-58 z" fill="#c9bba6"/>
    <path d="M118 150 q-34 66 -46 132 M150 150 q-6 80 -4 150 M182 150 q34 66 44 128" stroke="#6fa564" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M96 210 q-8 30 -4 54 M204 214 q8 26 4 48" stroke="#89b17b" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(1620 0)">
    <path d="M150 0 V132" stroke="#8a7a58" stroke-width="4"/>
    <path d="M110 132 h80 l-11 46 h-58 z" fill="#c07348"/>
    <path d="M120 132 q-30 60 -40 116 M150 132 q-4 70 -2 132 M180 132 q30 60 38 112" stroke="#6fa564" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wooden platform, screen-centre, for the player's plant -->
  <ellipse cx="960" cy="694" rx="248" ry="30" fill="#000" opacity="0.12"/>
  <rect x="772" y="624" width="376" height="72" rx="10" fill="#946235"/>
  <rect x="772" y="624" width="376" height="20" rx="10" fill="#a97a48"/>
  <g stroke="#7c5230" stroke-width="4"><path d="M836 644 V696 M960 644 V696 M1084 644 V696"/></g>

  <!-- watering can on the floor -->
  <g transform="translate(470 940)">
    <ellipse cx="46" cy="70" rx="52" ry="12" fill="#000" opacity="0.1"/>
    <path d="M8 26 h68 l-6 44 a6 6 0 0 1 -6 5 h-38 a6 6 0 0 1 -6 -5 z" fill="#8aa78f"/>
    <rect x="2" y="18" width="80" height="12" rx="4" fill="#9cbaa1"/>
    <path d="M76 34 q34 -6 44 22" stroke="#8aa78f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M8 30 q-20 -4 -22 -20" stroke="#8aa78f" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
